# Release `docintake` in namespace `docintake`: the Deployments, Services, Gateway, PVC and Secrets all take the release name
# (docintake-api, docintake-document, docintake-extraction, docintake-decisions, docintake-usage, ...).
# The cutover from the old `laya` release is in deploy/README.md ("Cutting over from the laya names").
image:
  tag: sha-000000002  # will be overridden by CI with actual commit SHA

telemetry:
  endpoint: https://api.honeycomb.io
  existingSecret: docintake-otel
  collector:
    enabled: true

# ClamAV scans every upload. It is on by default; the node must have the memory for it (see values.yaml).
malware:
  clamd:
    enabled: true

gateway:
  create: true
  hostname: api.mehmood.us
  pathPrefix: /docintake
  loadBalancerName: docintake
  tls:
    clusterIssuer: letsencrypt-prod

api:
  replicas: 1
  auth:
    existingSecret: docintake-api-key
  usage:
    persistence:
      enabled: true
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentAnalyses: 1
    maxQueuedAnalyses: 5
    requestTimeoutSeconds: 300

document:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentJobs: 1
    maxQueuedJobs: 5

extraction:
  replicas: 1
  existingSecret: docintake-llm
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi

decisions:
  replicas: 1
  # The Laya model is ~850 MB on disk and OOM-killed at 1Gi. The request is what makes the scheduler place the pod on a node
  # with room (ClamAV already uses ~1Gi of the first node). Measured 2026-10-13: ~1.96Gi after the model loaded, idle. The 3Gi limit leaves headroom for inference, which was not measured.
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 3Gi

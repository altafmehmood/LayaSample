# Release `docintake` in namespace `docintake`: the Deployments, Services, Gateway, PVC and Secrets all take the release name
# (docintake-api, docintake-document, docintake-extraction, docintake-usage, ...).
# The cutover from the old `laya` release is in deploy/README.md ("Cutting over from the laya names").
# DocIntake runs on the 2 vCPU / 4 GB `api` pool (autoscales 1 to 3); ClamAV (below) and the Dapr control plane run on the 2 vCPU / 4 GB `tools` pool.
nodeSelector:
  role: api

image:
  tag: sha-000000002  # will be overridden by CI with actual commit SHA

telemetry:
  endpoint: https://api.honeycomb.io
  existingSecret: docintake-otel
  collector:
    enabled: true

# ClamAV scans every upload. It is on by default; the node must have the memory for it (see values.yaml).
malware:
  clamd:
    enabled: true
    nodeSelector:
      role: tools   # ClamAV and the Dapr control plane live on the tools pool
    # A request, not a limit: if the tools node cannot hold ClamAV the pod goes Pending and the autoscaler adds a node (a limit would kill clamd during a signature reload).
    resources:
      requests: { memory: 1200Mi }

gateway:
  create: true
  hostname: api.mehmood.us
  pathPrefix: /docintake
  loadBalancerName: docintake
  tls:
    clusterIssuer: letsencrypt-prod

api:
  replicas: 1
  auth:
    existingSecret: docintake-api-key
  usage:
    persistence:
      enabled: true
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentAnalyses: 1
    maxQueuedAnalyses: 5
    requestTimeoutSeconds: 300

document:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentJobs: 1
    maxQueuedJobs: 5

extraction:
  replicas: 1
  existingSecret: docintake-llm
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi

fullnameOverride: laya
# The chart was renamed docintake on 2026-10-11, but the running release's selector labels (app.kubernetes.io/name) are
# immutable, so they keep the old chart name until the services cutover replaces these Deployments
# (docs/docintake-architecture.md). Namespace, release, secrets and image names are unchanged for the same reason.
nameOverride: laya-sample

image:
  tag: sha-000000002  # will be overridden by CI with actual commit SHA

telemetry:
  endpoint: https://api.honeycomb.io
  existingSecret: laya-otel
  collector:
    enabled: true

# ClamAV scans every upload. It is on by default; the node must have the memory for it (see values.yaml).
malware:
  clamd:
    enabled: true

gateway:
  create: true
  hostname: api.mehmood.us
  pathPrefix: /laya
  loadBalancerName: laya
  tls:
    clusterIssuer: letsencrypt-prod

api:
  replicas: 1
  auth:
    existingSecret: laya-api-key
  usage:
    persistence:
      enabled: true
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentAnalyses: 1
    maxQueuedAnalyses: 5
    requestTimeoutSeconds: 300

renderer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    maxConcurrentJobs: 1
    maxQueuedJobs: 5

extraction:
  replicas: 1
  existingSecret: laya-llm
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi

decisions:
  replicas: 1
  # What the gateway pod had while it still carried the model.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

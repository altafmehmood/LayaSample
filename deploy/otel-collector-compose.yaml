# Collector for docker-compose (profile "telemetry"): the document service's network has no route out, so it sends here and
# only this container forwards to Honeycomb. See README.md, "Telemetry".
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 160
    spike_limit_mib: 40
  resourcedetection:
    detectors: [env, system]
    override: false
  batch: {}
exporters:
  otlphttp:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }
    logs: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }

# Example values for a single 1 vCPU / 2 GB DOKS node. Copy, set the hostname and image tag, and install with
#   helm upgrade --install docintake deploy/helm/docintake -n docintake --create-namespace -f my-values.yaml
# (see deploy/README.md).

# Short, predictable names: services docintake-api and docintake-document, Gateway docintake (matches deploy/cluster-issuer.yaml).
fullnameOverride: docintake

image:
  tag: sha-REPLACE_WITH_COMMIT

gateway:
  hostname: docintake.example.com
  loadBalancerName: docintake
  tls:
    # Switch to letsencrypt-prod once the staging certificate has been issued.
    clusterIssuer: letsencrypt-staging

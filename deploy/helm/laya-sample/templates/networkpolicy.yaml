{{- if .Values.networkPolicy.enabled }}
# The renderer is the only process that parses untrusted documents with native code. Only the API may call it, and it
# may call nothing (it needs neither DNS nor the internet, unless telemetry goes to the collector), as on
# docker-compose's internal network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laya.fullname" . }}-renderer
  labels:
    {{- include "laya.labels" (dict "root" . "component" "renderer") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laya.selectorLabels" (dict "root" . "component" "renderer") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "laya.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  # Nothing, except telemetry to the in-cluster collector (and the DNS lookup of its Service) when the chart runs one.
  {{- if .Values.telemetry.collector.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "laya.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
  {{- else }}
  egress: []
  {{- end }}
{{- end }}

{{- if and .Values.api.usage.persistence.enabled (not .Values.api.usage.persistence.existingClaim) }}
# The usage history (a SQLite file). Kept on `helm uninstall`: it is the record of what the model cost, so deleting it is a
# deliberate `kubectl delete pvc`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "laya.fullname" . }}-usage
  labels:
    {{- include "laya.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.api.usage.persistence.accessMode }}
  {{- with .Values.api.usage.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.usage.persistence.size }}
{{- end }}

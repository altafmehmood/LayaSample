{{- if .Values.telemetry.collector.enabled }}
{{- $name := printf "%s-otel-collector" (include "laya.fullname" .) }}
# Receives OTLP from the API and the renderer inside the cluster and forwards it to the backend. It is the only pod
# that holds the backend key and the only one allowed to reach the internet, so the renderer's isolation stays intact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "laya.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laya.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laya.labels" (dict "root" . "component" "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum | quote }}
        {{- with .Values.telemetry.headersChecksum }}
        checksum/otel-headers: {{ . | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "laya.podSecurityContext" . | nindent 8 }}
      containers:
        - name: collector
          image: {{ printf "%s:%s" .Values.telemetry.collector.image .Values.telemetry.collector.tag | quote }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
          {{- if .Values.telemetry.existingSecret }}
          env:
            # optional: a missing Secret sends unauthenticated data that the backend rejects, instead of stopping the pod.
            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.existingSecret | quote }}
                  key: {{ .Values.telemetry.collector.apiKeyKey | quote }}
                  optional: true
          {{- end }}
          readinessProbe:
            tcpSocket: { port: otlp-http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.telemetry.collector.resources | nindent 12 }}
          securityContext:
            {{- include "laya.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "laya.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  selector:
    {{- include "laya.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
# Telemetry in from the API and the renderer; out only to the backend (HTTPS) and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "laya.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laya.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "laya.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "laya.selectorLabels" (dict "root" . "component" "renderer") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
{{- end }}
{{- end }}

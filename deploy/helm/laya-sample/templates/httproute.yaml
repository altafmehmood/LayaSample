{{- if .Values.gateway.enabled }}
{{- $tls := .Values.gateway.tls }}
{{- $host := required "gateway.hostname is required" .Values.gateway.hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "laya.fullname" . }}-api
  labels:
    {{- include "laya.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    {{- include "laya.parentRef" (dict "root" . "listener" (ternary "https" "http" $tls.enabled)) | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /laya
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "laya.fullname" . }}-api
          port: 8080
      timeouts:
        request: {{ .Values.gateway.requestTimeout }}
{{- if $tls.enabled }}
---
# Plain HTTP is only used for Let's Encrypt challenges (cert-manager adds a more specific route for those) and is
# redirected to HTTPS otherwise.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "laya.fullname" . }}-https-redirect
  labels:
    {{- include "laya.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    {{- include "laya.parentRef" (dict "root" . "listener" "http") | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}

# One replica each, one document at a time, short queues. The API, the document service and the extraction service alone fit a 1 vCPU / 2 GB node, but the
# ClamAV pod (malware.clamd, on by default) needs about 4 GB more: use a node with 8 GB, or turn it off.
# See deploy/README.md. Settings under `config` map to DocumentAnalysis__* environment variables.

nameOverride: ""
fullnameOverride: ""

# Node labels every DocIntake pod must match (all five Deployments). Empty lets the scheduler use any node. On DOKS the pools carry
# `role=<name>` labels, e.g. `nodeSelector: { role: api }`. Dapr's and cert-manager's own pods are placed by their charts, not this.
nodeSelector: {}

image:
  registry: ghcr.io/altafmehmood
  # Required. Pin the commit tag CI pushes (sha-<commit>); `latest` moves under you.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

api:
  image: docintake-api
  replicas: 1
  config:
    # Documents analysed at once, and requests allowed to wait for a slot (further ones get 503 + Retry-After).
    maxConcurrentAnalyses: 1
    maxQueuedAnalyses: 5
    # Includes time spent queued. OCR on one vCPU is slow, so this is above the app's 120 s default.
    requestTimeoutSeconds: 300
    maxFileBytes: 20971520
  resources:
    # No CPU limit: a limit would throttle OCR-heavy requests and lower the CPU count the app sizes itself from.
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # The gateway loads no model and is ready in seconds; allow failureThreshold x periodSeconds (2 minutes) before restarting.
  startupProbe: { periodSeconds: 5, failureThreshold: 24 }
  # Access key for POST /api/documents/extract, which spends model-provider money. Callers send it as `X-Api-Key`.
  auth:
    # Secret holding the key(s), created outside Helm so they never land in the release history:
    #   kubectl -n <ns> create secret generic docintake-api-key --from-literal=api-key="$(openssl rand -base64 32)"
    # Empty, or no usable key: extraction answers 503 (it fails closed).
    existingSecret: ""
    # Entries of that Secret to accept. To rotate: add the new key under a second entry (e.g. api-key-next), list both,
    # deploy, move callers to the new key, then remove the old entry.
    secretKeys: [api-key]
    # Short hash of the key(s) (never the key itself), set by CI so pods restart when a key changes.
    keyChecksum: ""
    # Entries of that Secret that are also accepted everywhere and may read every caller's usage (a plain key sees only the
    # rows of its own). Empty: nobody can read other callers' rows. Needs the entries to exist in the Secret.
    adminSecretKeys: []
  # Model usage history: one row per model call (API-key fingerprint, file name, tokens, list-price cost), kept in a SQLite
  # file and served at GET /api/usage and /api/usage/summary (JSON or CSV).
  usage:
    persistence:
      # false: the file lives in an emptyDir and is lost whenever the pod is replaced.
      enabled: true
      size: 1Gi
      # Empty: the cluster's default class (DOKS: do-block-storage).
      storageClass: ""
      # One pod owns the file, so ReadWriteOnce. The Deployment replaces the pod in place (maxSurge 0), so the volume is free
      # when the new pod starts.
      accessMode: ReadWriteOnce
      # An existing claim to use instead of creating one. The chart's own claim is kept on `helm uninstall`.
      existingClaim: ""
  extraEnv: []

# OpenTelemetry export (traces, metrics, logs) over OTLP. Empty endpoint: nothing is exported.
# With `collector.enabled` the services send to a collector pod in the cluster, which alone holds the key and
# reaches the backend; the document service's NetworkPolicy then allows only that collector (and DNS). Without it the API exports
# directly and the document service exports nothing, because opening egress for it would weaken its isolation.
telemetry:
  # e.g. https://api.honeycomb.io (OTLP over HTTP).
  endpoint: ""
  # Secret holding the OTLP headers, under `headersKey`, as `x-honeycomb-team=<ingest key>`. Create it outside Helm:
  #   kubectl -n <ns> create secret generic docintake-otel --from-literal=headers="x-honeycomb-team=<ingest key>"
  # A missing Secret leaves the pod starting with no headers (the backend then rejects the data) instead of failing.
  existingSecret: ""
  headersKey: headers
  # Short hash of the headers (never the headers), set by CI so pods restart when the key is rotated.
  headersChecksum: ""
  collector:
    enabled: false
    # OpenTelemetry Collector (contrib distribution, Apache-2.0). Pin the tag.
    image: docker.io/otel/opentelemetry-collector-contrib
    tag: 0.162.0
    # With the collector, the Secret above also needs the bare key under `apiKeyKey`, sent as the `headerName` header
    # (Honeycomb: x-honeycomb-team). The `headersKey` entry is only used when the API exports directly.
    headerName: x-honeycomb-team
    apiKeyKey: api-key
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 256Mi }

# Malware scanning: the API streams every upload to the scan service, which passes it to a ClamAV daemon in the same pod, before
# anything parses it, and refuses the upload (422) when it is infected. ClamAV is GPL-2.0; it runs as its own container
# and is not part of the application.
malware:
  clamd:
    # Overrides the top-level nodeSelector for the ClamAV pod only (it is the one pod that needs a big node and nothing else beside it).
    nodeSelector: {}
    enabled: true
    image: docker.io/clamav/clamav
    # Debian, multi-arch, without a baked-in database: the pod downloads the signatures on start (a few minutes) and
    # keeps them updated. Pin the tag.
    tag: 1.5.4_base-debian13-slim
    # What the API does while the scanner gives no verdict: `closed` refuses uploads with 503 + Retry-After, `open` lets
    # them through unscanned (and logs a warning).
    failMode: closed
    # The scan service runs next to clamd in the same pod and is the only thing that talks to it (over the pod's loopback).
    # A new GHCR package starts private on GitHub: make docintake-scan public after CI first pushes it (deploy/README.md).
    scan:
      image: docintake-scan
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 256Mi }
    # clamd keeps the signature database in memory (about 1 GiB measured at rest; ClamAV's documentation advises 3-4 GiB because a
    # database reload can double it), so the node needs that much free. There is deliberately no memory LIMIT: a limit would kill clamd
    # at the moment of a reload. A REQUEST is optional: with none the pod is BestEffort, so the scheduler ignores its size, the cluster
    # autoscaler never adds a node for it, and under memory pressure it is evicted first (uploads answer 503 meanwhile). On a
    # pool that autoscales, set one (deploy/values-prod.yaml does).
    resources: {}

document:
  image: docintake-document
  replicas: 1
  config:
    maxConcurrentJobs: 1
    maxQueuedJobs: 5
    # Leave empty to keep the model baked into the image (PPOCRv5Latin unless built otherwise).
    ocrModel: ""
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    # Measured peak is about 550 MiB OCRing a five-page scan.
    limits: { memory: 1Gi }
  startupProbe: { periodSeconds: 10, failureThreshold: 60 }
  extraEnv: []

# The extraction service (POST /api/documents/extract is answered by the gateway, which calls this). The only pod that holds the
# model provider's API key and reaches the internet. Document pages are sent to the model provider, so they leave the cluster.
extraction:
  # A new package starts private on GitHub: make docintake-extraction public after CI first pushes it (deploy/README.md).
  image: docintake-extraction
  replicas: 1
  # Secret holding the provider API key, under `secretKey`. Empty, or the Secret missing: extraction answers 503.
  # Create it outside Helm so the key never lands in the release history:
  #   kubectl -n <ns> create secret generic docintake-llm --from-literal=api-key=...
  existingSecret: ""
  secretKey: api-key
  # Short hash of the key (never the key), set by CI so pods restart when the key is rotated.
  keyChecksum: ""
  provider: openai
  # Models for documents sent as page images / as text. Tune with the evaluation harness (see deploy/README.md).
  visionModel: gpt-6.1-sol
  textModel: gpt-6-luna
  # Extractions in flight at once. They mostly wait on the provider but each holds the document and its page images.
  maxConcurrent: 4
  # One provider call, including retries by the SDK. The gateway's request timeout still caps the whole request.
  timeoutSeconds: 120
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 768Mi }
  startupProbe: { periodSeconds: 5, failureThreshold: 24 }
  extraEnv: []

# The document service reads every untrusted document: only the API may reach it, and it may reach nothing.
# The extraction service may be reached only by the API and may reach only the internet on 443 (the model provider), DNS and
# the collector.
networkPolicy:
  enabled: true

# Encryption of the hops inside the release. A private CA (made here, kept in a Secret) lets cert-manager issue the API's serving
# certificate: the API serves HTTPS on 8443 and the Gateway checks that certificate (BackendTLSPolicy). Needs cert-manager (the
# same one that issues the public certificate). Off: the API serves plain HTTP on 8080, as under docker-compose.
internalTls:
  enabled: true
  caValidityDays: 3650
  certDuration: 2160h
  certRenewBefore: 720h

# Dapr sidecars carry the API's calls to the document, extraction and scan services over mutual TLS, and each of those accepts
# only the API (deny by default, per operation). Dapr must be installed in the cluster first (deploy/README.md). Off: the
# calls are plain HTTP between Services, as under docker-compose. Dapr is used for service invocation only: no SDK, no
# state, no pub/sub, no secrets.
dapr:
  enabled: true
  # Where Dapr's control plane is installed.
  namespace: dapr-system
  # The trust domain of the Kubernetes cluster's Dapr control plane (Dapr's default is the cluster domain).
  controlPlaneTrustDomain: cluster.local
  # The trust domain of Dapr's Sentry (its default is `public`).
  trustDomain: public
  # Documents are sent through the sidecars; the default request limit of 4 MB would refuse most of them.
  maxBodySize: 32Mi
  # Spans from the sidecars themselves (the hop between the API and a service, mTLS included), sent to the in-cluster collector
  # (telemetry.collector.enabled). 0 sends none (the trace context still travels, so the services' spans stay in one trace).
  # Without the collector there is nowhere to send them, so they are not exported whatever this says.
  tracing:
    samplingRate: "1"
  sidecar:
    # Measured on kind (arm64), Dapr 1.18.7, one 19 MB upload: the callees' sidecars peaked at about 60 MiB, so 192Mi is room.
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 250m, memory: 192Mi }
    # Per service (api | document | extraction | scan). The gateway's sidecar carries every upload out and holds it while it
    # does: at 192Mi it was OOM-killed on the second 19 MB upload in a row, so it gets more. The extraction sidecar carries the
    # page images and has not been measured (that needs the paid model path): see docs/internal-transport-security.md.
    overrides:
      api:
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
      extraction:
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 384Mi }

gateway:
  enabled: true
  # Public DNS name of the API. Required when the gateway is enabled.
  hostname: ""
  # true: this chart creates the Gateway. false: attach the route to a Gateway that already exists (see `existing`).
  create: true
  # GatewayClass for the Gateway. DOKS provides `cilium` (managed Gateway API) on VPC-native clusters, 1.33+.
  className: cilium
  # Name of the Gateway this chart creates; defaults to the release's full name.
  name: ""
  # DigitalOcean load balancer name (annotation service.beta.kubernetes.io/do-loadbalancer-name). Optional.
  loadBalancerName: ""
  # Extra load balancer annotations. DigitalOcean allows at most 8 in total.
  infrastructureAnnotations: {}
  existing:
    name: ""
    namespace: ""
    httpSectionName: http
    httpsSectionName: https
  tls:
    enabled: true
    # Secret the Gateway terminates TLS with. cert-manager creates it when clusterIssuer is set. Defaults to <gateway>-tls.
    secretName: ""
    # ClusterIssuer cert-manager uses for the HTTPS listener (deploy/cluster-issuer.yaml). Empty: bring your own Secret.
    clusterIssuer: letsencrypt-prod
  # Path the API is published under, e.g. /docintake. The prefix is stripped before the request reaches the API.
  pathPrefix: /
  # Longer than the API's request timeout (api.config.requestTimeoutSeconds), so the API answers before the gateway cuts in.
  requestTimeout: 330s

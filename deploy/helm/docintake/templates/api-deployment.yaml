apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docintake.fullname" . }}-api
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # A single small node cannot hold the old and the new pod at once, so replace in place.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docintake.labels" (dict "root" . "component" "api") | nindent 8 }}
      {{- if or .Values.api.extraction.keyChecksum .Values.api.auth.keyChecksum .Values.telemetry.headersChecksum }}
      annotations:
        # Environment variables from a Secret are read at start, so a changed key needs new pods.
        {{- with .Values.api.extraction.keyChecksum }}
        checksum/llm-key: {{ . | quote }}
        {{- end }}
        {{- with .Values.api.auth.keyChecksum }}
        checksum/api-key: {{ . | quote }}
        {{- end }}
        {{- with .Values.telemetry.headersChecksum }}
        checksum/otel-headers: {{ . | quote }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "docintake.podSecurityContext" . | nindent 8 }}
        {{- if .Values.api.usage.persistence.enabled }}
        # A new block volume is mounted root-owned; this makes it writable for the non-root user.
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "docintake.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # The API refuses to start without a renderer to talk to.
            - name: DocumentAnalysis__RendererUrl
              value: {{ printf "http://%s-renderer:8080" (include "docintake.fullname" .) | quote }}
            - name: DocumentAnalysis__MaxConcurrentAnalyses
              value: {{ .Values.api.config.maxConcurrentAnalyses | int64 | quote }}
            - name: DocumentAnalysis__MaxQueuedAnalyses
              value: {{ .Values.api.config.maxQueuedAnalyses | int64 | quote }}
            - name: DocumentAnalysis__RequestTimeoutSeconds
              value: {{ .Values.api.config.requestTimeoutSeconds | int64 | quote }}
            - name: DocumentAnalysis__MaxFileBytes
              value: {{ .Values.api.config.maxFileBytes | int64 | quote }}
            - name: Extraction__Provider
              value: {{ .Values.api.extraction.provider | quote }}
            - name: Extraction__VisionModel
              value: {{ .Values.api.extraction.visionModel | quote }}
            - name: Extraction__TextModel
              value: {{ .Values.api.extraction.textModel | quote }}
            - name: Extraction__MaxConcurrentExtractions
              value: {{ .Values.api.extraction.maxConcurrent | int64 | quote }}
            - name: Extraction__TimeoutSeconds
              value: {{ .Values.api.extraction.timeoutSeconds | int64 | quote }}
            {{- with .Values.api.extraction.existingSecret }}
            # optional: a missing Secret means extraction answers 503 instead of the pod failing to start.
            - name: Extraction__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.api.extraction.secretKey | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.api.auth.existingSecret }}
            # Keys callers must send as X-Api-Key to POST /api/documents/extract. optional: a missing Secret leaves extraction
            # answering 503 (it fails closed) instead of stopping the pod.
            {{- range $i, $key := .Values.api.auth.secretKeys }}
            - name: {{ printf "Auth__ApiKeys__%d" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.api.auth.existingSecret | quote }}
                  key: {{ $key | quote }}
                  optional: true
            {{- end }}
            {{- range $i, $key := .Values.api.auth.adminSecretKeys }}
            - name: {{ printf "Auth__AdminKeys__%d" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.api.auth.existingSecret | quote }}
                  key: {{ $key | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if .Values.malware.clamd.enabled }}
            # Every upload is scanned by the ClamAV pod before anything parses it.
            - name: Security__Malware__Provider
              value: clamd
            - name: Security__Malware__Host
              value: {{ printf "%s-clamav" (include "docintake.fullname" .) | quote }}
            - name: Security__Malware__Port
              value: "3310"
            - name: Security__Malware__FailMode
              value: {{ .Values.malware.clamd.failMode | quote }}
            {{- else }}
            - name: Security__Malware__Provider
              value: none
            {{- end }}
            # Where the usage history is kept: the mounted volume below.
            - name: Usage__DatabasePath
              value: /data/usage.db
            {{- if .Values.gateway.enabled }}
            # Public URL Scalar's "Try it" calls: the OpenAPI document would otherwise advertise http:// and no path prefix.
            - name: OpenApi__ServerUrl
              value: {{ printf "%s://%s%s" (ternary "https" "http" .Values.gateway.tls.enabled) .Values.gateway.hostname (.Values.gateway.pathPrefix | trimSuffix "/") | quote }}
            {{- end }}
            {{- include "docintake.telemetryEnv" . | nindent 12 }}
            {{- if not .Values.telemetry.collector.enabled }}
            {{- with .Values.telemetry.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            {{- with $.Values.telemetry.existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.telemetry.headersKey | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "docintake.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: data
          {{- if .Values.api.usage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.api.usage.persistence.existingClaim | default (printf "%s-usage" (include "docintake.fullname" .)) }}
          {{- else }}
          emptyDir:
            sizeLimit: 256Mi
          {{- end }}

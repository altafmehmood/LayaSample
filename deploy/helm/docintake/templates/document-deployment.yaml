apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docintake.fullname" . }}-document
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "document") | nindent 4 }}
spec:
  replicas: {{ .Values.document.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "document") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docintake.labels" (dict "root" . "component" "document") | nindent 8 }}
      {{- if .Values.dapr.enabled }}
      annotations:
        {{- include "docintake.daprAnnotations" (dict "root" . "name" "document" "appPort" 8080) | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "docintake.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: document
          image: {{ include "docintake.image" (dict "root" . "image" .Values.document.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DocumentAnalysis__MaxConcurrentJobs
              value: {{ .Values.document.config.maxConcurrentJobs | int64 | quote }}
            - name: DocumentAnalysis__MaxQueuedJobs
              value: {{ .Values.document.config.maxQueuedJobs | int64 | quote }}
            {{- with .Values.document.config.ocrModel }}
            - name: DocumentAnalysis__OcrModel
              value: {{ . | quote }}
            {{- end }}
            {{- include "docintake.telemetryEnv" . | nindent 12 }}
            {{- with .Values.document.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: {{ .Values.document.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.document.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.document.resources | nindent 12 }}
          securityContext:
            {{- include "docintake.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "docintake.caMount" . | nindent 12 }}
      volumes:
        {{- include "docintake.caVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

{{- if .Values.telemetry.collector.enabled }}
{{- $name := printf "%s-otel-collector" (include "docintake.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            {{- if .Values.internalTls.enabled }}
            # TLS from the release's private CA. The collector re-reads the files when cert-manager renews them.
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key
              reload_interval: 1h
            {{- end }}
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 160
        spike_limit_mib: 40
      # Adds host.name (and anything in OTEL_RESOURCE_ATTRIBUTES of the collector) to data that lacks it; the services' own
      # attributes win (override: false).
      resourcedetection:
        detectors: [env, system]
        override: false
      batch: {}
    exporters:
      otlphttp:
        endpoint: {{ required "telemetry.endpoint is required when telemetry.collector.enabled" .Values.telemetry.endpoint | quote }}
        {{- if .Values.telemetry.existingSecret }}
        headers:
          {{ .Values.telemetry.collector.headerName }}: ${env:BACKEND_API_KEY}
        {{- end }}
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }
        metrics: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }
        logs: { receivers: [otlp], processors: [memory_limiter, resourcedetection, batch], exporters: [otlphttp] }
{{- end }}

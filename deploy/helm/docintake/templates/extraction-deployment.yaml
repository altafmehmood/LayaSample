apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docintake.fullname" . }}-extraction
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "extraction") | nindent 4 }}
spec:
  replicas: {{ .Values.extraction.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "extraction") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docintake.labels" (dict "root" . "component" "extraction") | nindent 8 }}
      {{- if or .Values.extraction.keyChecksum .Values.telemetry.headersChecksum }}
      annotations:
        # Environment variables from a Secret are read at start, so a changed key needs new pods.
        {{- with .Values.extraction.keyChecksum }}
        checksum/llm-key: {{ . | quote }}
        {{- end }}
        {{- with .Values.telemetry.headersChecksum }}
        checksum/otel-headers: {{ . | quote }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "docintake.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: extraction
          image: {{ include "docintake.image" (dict "root" . "image" .Values.extraction.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Extraction__Provider
              value: {{ .Values.extraction.provider | quote }}
            - name: Extraction__VisionModel
              value: {{ .Values.extraction.visionModel | quote }}
            - name: Extraction__TextModel
              value: {{ .Values.extraction.textModel | quote }}
            - name: Extraction__MaxConcurrentExtractions
              value: {{ .Values.extraction.maxConcurrent | int64 | quote }}
            - name: Extraction__TimeoutSeconds
              value: {{ .Values.extraction.timeoutSeconds | int64 | quote }}
            {{- with .Values.extraction.existingSecret }}
            # optional: a missing Secret means extraction answers 503 instead of the pod failing to start.
            - name: Extraction__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.extraction.secretKey | quote }}
                  optional: true
            {{- end }}
            {{- include "docintake.telemetryEnv" . | nindent 12 }}
            {{- with .Values.extraction.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: {{ .Values.extraction.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.extraction.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.extraction.resources | nindent 12 }}
          securityContext:
            {{- include "docintake.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docintake.fullname" . }}-decisions
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "decisions") | nindent 4 }}
spec:
  replicas: {{ .Values.decisions.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "decisions") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docintake.labels" (dict "root" . "component" "decisions") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "docintake.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: decisions
          image: {{ include "docintake.image" (dict "root" . "image" .Values.decisions.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "docintake.telemetryEnv" . | nindent 12 }}
            {{- with .Values.decisions.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: {{ .Values.decisions.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.decisions.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.decisions.resources | nindent 12 }}
          securityContext:
            {{- include "docintake.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

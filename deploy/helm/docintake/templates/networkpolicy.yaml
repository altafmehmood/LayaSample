{{- if .Values.networkPolicy.enabled }}
# The document service is the only process that parses untrusted documents with native code. Only the API may call it, and it
# may call nothing (it needs neither DNS nor the internet, unless telemetry goes to the collector), as on
# docker-compose's internal network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docintake.fullname" . }}-document
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "document") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "document") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "docintake.calleePort" $ }}
  # Nothing, except telemetry to the in-cluster collector and the Dapr control plane (the sidecar fetches its certificate from
  # Sentry), with the DNS lookup of their Services.
  {{- if or .Values.telemetry.collector.enabled .Values.dapr.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.telemetry.collector.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    {{- end }}
    {{- include "docintake.daprEgress" . | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
---
# The extraction service holds the model provider's key and is the only pod that talks to the internet for it. Only the API may
# call it. It may reach DNS, the collector (telemetry) and port 443 anywhere (the provider's addresses are not fixed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docintake.fullname" . }}-extraction
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "extraction") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "extraction") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "docintake.calleePort" $ }}
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
    {{- if .Values.telemetry.collector.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    {{- end }}
    {{- include "docintake.daprEgress" . | nindent 4 }}
{{- end }}

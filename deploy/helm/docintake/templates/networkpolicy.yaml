{{- if .Values.networkPolicy.enabled }}
# The renderer is the only process that parses untrusted documents with native code. Only the API may call it, and it
# may call nothing (it needs neither DNS nor the internet, unless telemetry goes to the collector), as on
# docker-compose's internal network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docintake.fullname" . }}-renderer
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "renderer") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "renderer") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  # Nothing, except telemetry to the in-cluster collector (and the DNS lookup of its Service) when the chart runs one.
  {{- if .Values.telemetry.collector.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
  {{- else }}
  egress: []
  {{- end }}
---
# The extraction service holds the model provider's key and is the only pod that talks to the internet for it. Only the API may
# call it. It may reach DNS, the collector (telemetry) and port 443 anywhere (the provider's addresses are not fixed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docintake.fullname" . }}-extraction
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "extraction") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "extraction") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
    {{- if .Values.telemetry.collector.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    {{- end }}
---
# Laya runs on a model baked into the image and needs no network. Only the API may call it, and it may call nothing, except
# telemetry to the in-cluster collector (and the DNS lookup of its Service) when the chart runs one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docintake.fullname" . }}-decisions
  labels:
    {{- include "docintake.labels" (dict "root" . "component" "decisions") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docintake.selectorLabels" (dict "root" . "component" "decisions") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- if .Values.telemetry.collector.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "docintake.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
  {{- else }}
  egress: []
  {{- end }}
{{- end }}

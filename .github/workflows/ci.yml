name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      evaluate_extraction:
        description: Run the AI extraction evaluation over the lending corpus (calls the paid OpenAI API)
        type: boolean
        default: false
      redteam:
        description: Red-team the extraction API with garak, once with the defences on and once with them in flag mode (every prompt is a paid OpenAI call)
        type: boolean
        default: false
      redteam_probes:
        description: garak probes to run (a few prompts each by default; see redteam/README.md)
        type: string
        default: probes.promptinject.HijackHateHumans,probes.latentinjection.LatentInjectionResume,probes.encoding.InjectBase64

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (lock files must be up to date)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      # Dependency policy (CLAUDE.md): permissive licences only, transitive dependencies included.
      - name: Licences
        run: dotnet dnx -y nuget-license@4.0.18 -- -i DocIntake.slnx -t -a .github/allowed-licenses.json

  # Every run builds both images. Pushes to main also publish them to GHCR, tagged with the commit SHA and latest;
  # pull requests build without pushing, so they never need write access to the registry.
  docker:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, document, extraction, decisions]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docintake-${{ matrix.target }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The Helm chart must lint, render and validate against the Kubernetes and Gateway API schemas for every values
  # file in deploy/helm/docintake/ci. Nothing is deployed.
  helm:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # datreeio/CRDs-catalog commit with the Gateway API JSON schemas (MIT).
      CRD_SCHEMAS_COMMIT: 63669a570e231d4f1f8396d229a1de512bcf0a34
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sfL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform

      - name: Lint, render and validate
        run: |
          helm version --short
          for values in deploy/helm/docintake/ci/*.yaml; do
            echo "::group::$values"
            helm lint deploy/helm/docintake -f "$values"
            helm template docintake deploy/helm/docintake -f "$values" | ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_SCHEMAS_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
            echo "::endgroup::"
          done

  # Deploy to DOKS cluster on main branch push after passing helm validation
  deploy:
    needs: [build-test, docker, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.DO_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply cert-manager issuers
        run: |
          envsubst < deploy/cluster-issuer.yaml | kubectl apply -f -
        env:
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}

      # The key lives only in this Secret (created outside Helm, so it never enters the release history). Without
      # the GitHub secret, deployment still works and /api/documents/extract answers 503.
      - name: Store the model provider API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set; extraction will answer 503"
            exit 0
          fi
          kubectl create namespace docintake --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n docintake create secret generic docintake-llm --from-literal=api-key="$OPENAI_API_KEY" --dry-run=client -o yaml | kubectl apply -f -
          echo "KEY_CHECKSUM=$(printf %s "$OPENAI_API_KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # Callers of POST /api/documents/extract must send this as X-Api-Key. Without the GitHub secret the deploy still
      # works, but extraction answers 503 (it fails closed) until the secret is added.
      - name: Store the API access key
        env:
          # LAYA_API_KEY is the old secret name; it is used until DOCINTAKE_API_KEY is added.
          DOCINTAKE_API_KEY: ${{ secrets.DOCINTAKE_API_KEY || secrets.LAYA_API_KEY }}
        run: |
          if [ -z "$DOCINTAKE_API_KEY" ]; then
            echo "::warning::DOCINTAKE_API_KEY is not set; /api/documents/extract will answer 503"
            exit 0
          fi
          kubectl create namespace docintake --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n docintake create secret generic docintake-api-key --from-literal=api-key="$DOCINTAKE_API_KEY" --dry-run=client -o yaml | kubectl apply -f -
          echo "AUTH_KEY_CHECKSUM=$(printf %s "$DOCINTAKE_API_KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # Telemetry goes to Honeycomb through the in-cluster collector, which alone holds the ingest key. Without the GitHub
      # secret the deploy still works, but nothing is exported. `headers` is what the API would use without the collector.
      - name: Store the Honeycomb ingest key
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          if [ -z "$HONEYCOMB_API_KEY" ]; then
            echo "::warning::HONEYCOMB_API_KEY is not set; telemetry will not be exported"
            exit 0
          fi
          kubectl create namespace docintake --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n docintake create secret generic docintake-otel \
            --from-literal=api-key="$HONEYCOMB_API_KEY" \
            --from-literal=headers="x-honeycomb-team=$HONEYCOMB_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "OTEL_CHECKSUM=$(printf %s "$HONEYCOMB_API_KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Deploy Helm chart
        run: |
          # Get the commit SHA short form
          COMMIT_SHA=$(git rev-parse --short HEAD)

          helm upgrade --install docintake deploy/helm/docintake \
            --namespace docintake \
            --create-namespace \
            --values deploy/values-prod.yaml \
            --set image.tag=sha-${COMMIT_SHA} \
            --set-string extraction.keyChecksum="${KEY_CHECKSUM:-}" \
            --set-string api.auth.keyChecksum="${AUTH_KEY_CHECKSUM:-}" \
            --set-string telemetry.headersChecksum="${OTEL_CHECKSUM:-}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deploy/docintake-api -n docintake --timeout=5m
          kubectl rollout status deploy/docintake-document -n docintake --timeout=5m
          kubectl rollout status deploy/docintake-extraction -n docintake --timeout=5m
          kubectl rollout status deploy/docintake-decisions -n docintake --timeout=15m
          kubectl get gateway -n docintake -o wide
          kubectl get pods -n docintake

  # Manual only: scores the real model against the lending corpus manifest. Needs the OPENAI_API_KEY secret.
  extraction-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.evaluate_extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Evaluate extraction accuracy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_EXTRACTION_EVAL: "1"
        run: dotnet run --project tests/DocIntake.Tests -c Release -- -trait "Category=Evaluation" -showLiveOutput

  # Manual only: starts the stack on the runner and attacks it with garak (see redteam/README.md). Needs the OPENAI_API_KEY
  # secret, and spends it: every prompt is a model call. Never runs on push and never targets production.
  redteam:
    if: github.event_name == 'workflow_dispatch' && inputs.redteam
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the stack with a throwaway access key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set; the extraction API cannot call the model"
            exit 1
          fi
          echo "DOCINTAKE_API_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # The key is read from the environment of the next steps, which is set from the line above.

      - name: Attack with the defences on
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker compose up -d --build --wait
          redteam/run.sh --target http://localhost:8080 --label reject --probes "${{ inputs.redteam_probes }}" --max-requests 2000

      - name: Attack the model itself (findings flagged, not refused)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCINTAKE_ON_FINDING: flag
        run: |
          docker compose up -d --force-recreate --wait api
          redteam/run.sh --target http://localhost:8080 --label flag --probes "${{ inputs.redteam_probes }}" --max-requests 2000

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garak-reports
          path: redteam/reports/
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose down -v

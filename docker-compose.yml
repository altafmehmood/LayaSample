# The gateway (api), the isolated document service (renderer), the extraction service and the decisions service (Laya).
#
#   docker compose up --build                                   # http://localhost:8080
#   OCR_MODEL=PPOCRv6Medium docker compose up --build           # multilingual OCR
#
# Only the document service reads documents: it classifies and prepares every upload with PdfPig, the Office libraries,
# PDFium, ImageMagick and OCR. It sits on an internal network with no route out, a read-only file system, no Linux
# capabilities and its own memory/CPU/process limits, so a malicious document that crashes or takes over a parser can
# neither reach the network nor touch the gateway.
#
# Only the extraction service holds the model provider's key (OPENAI_API_KEY) and reaches the internet for it. The gateway
# sends it the prepared document and gets back the data and the model calls made, which the gateway records as usage.
#
# Laya, the feedback model, runs in the decisions service, on the internal network like the document service: the model is in
# its image, so it needs no network. The gateway starts in seconds; the decisions service is ready a few minutes later.

name: docintake

services:
  api:
    build:
      context: .
      target: api
    image: docintake-api
    ports:
      - "8080:8080"
    environment:
      DocumentAnalysis__DocumentServiceUrl: http://renderer:8080
      # Where the extraction service is. It holds the provider key; without one it answers 503 and so does the gateway.
      Extraction__ServiceUrl: http://extraction:8080
      # Where Laya is. Feedback analysis answers 503 until its model has loaded.
      Decisions__ServiceUrl: http://decisions:8080
      # Callers must send this as X-Api-Key to /api/documents/extract; empty makes extraction answer 503.
      Auth__ApiKeys__0: ${DOCINTAKE_API_KEY:-}
      # Where the usage history (tokens and cost per model call) is kept: the volume below.
      Usage__DatabasePath: /data/usage.db
      # Every upload is streamed to ClamAV before anything parses it. closed: while it does not answer, uploads get 503.
      Security__Malware__Host: clamav
      # reject (default): a blocking finding (hidden text, active content, instructions for the model) refuses the upload
      # with 422. flag: report it in the response and carry on. The red-team run uses flag to test the model itself.
      Security__OnFinding: ${DOCINTAKE_ON_FINDING:-reject}
      # OpenTelemetry export. Either straight to a backend (OTEL_EXPORTER_OTLP_ENDPOINT=https://api.honeycomb.io and
      # OTEL_EXPORTER_OTLP_HEADERS=x-honeycomb-team=<ingest key>), or through the collector below
      # (DOCINTAKE_OTLP_ENDPOINT=http://collector:4318), which also carries the other services' telemetry. Empty exports nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCINTAKE_OTLP_ENDPOINT:-${OTEL_EXPORTER_OTLP_ENDPOINT:-}}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks: [public, internal]
    volumes:
      - usage-data:/data
    depends_on:
      clamav:
        condition: service_healthy
    # Was 3g while the gateway also held Laya. The gateway holds no model now; this is a guess, not a measurement.
    mem_limit: 2g
    cpus: 4
    restart: unless-stopped

  # Scans every upload for malware. The first start downloads the signature database (a few minutes), after which it
  # reports healthy and the API starts. On the public network only: it needs the internet for signature updates, and the
  # renderer, which is on the internal network alone, must not be able to reach it. No memory or CPU limits, by choice:
  # about 1 GiB at rest, and ClamAV's documentation advises 3-4 GiB for when a signature update reloads.
  # Published on loopback so `CLAMD_HOST=localhost dotnet run --project tests/DocIntake.Tests -- -trait "Category=Integration"`
  # can scan with it.
  clamav:
    image: clamav/clamav:1.5.4_base-debian13-slim
    entrypoint: ["/init-unprivileged"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/log/clamav:uid=1000,gid=1000
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"
    networks: [public]
    restart: unless-stopped

  # Turns a prepared document into structured data. On the public network only: it needs the internet to reach the model
  # provider, and nothing it receives is ever executed or parsed here. Hardened like the renderer, but with egress.
  extraction:
    build:
      context: .
      target: extraction
    image: docintake-extraction
    environment:
      # Enables extraction; empty leaves it answering 503.
      Extraction__ApiKey: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCINTAKE_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks: [public]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

  # Laya, the local model that scores hotel-guest feedback. On the internal network (no route out): the model is baked into
  # the image. Hardened like the renderer.
  decisions:
    build:
      context: .
      target: decisions
    image: docintake-decisions
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCINTAKE_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

  renderer:
    build:
      context: .
      target: renderer
      args:
        OCR_MODEL: ${OCR_MODEL:-PPOCRv5Latin}
    image: docintake-renderer
    environment:
      # Set with the collector profile; the document service can reach nothing else.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCINTAKE_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 4
    pids_limit: 512
    # A document that crashes the document service fails its own request (502 from the API); the service comes straight back.
    restart: always

  # docker compose --profile telemetry up   with DOCINTAKE_OTLP_ENDPOINT=http://collector:4318 and HONEYCOMB_API_KEY=<ingest key>
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [telemetry]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-compose.yaml:/etc/otelcol/config.yaml:ro
    environment:
      HONEYCOMB_API_KEY: ${HONEYCOMB_API_KEY:-}
    # On the internal network to receive from the renderer, and on the public one to receive from the extraction service and reach the backend.
    networks: [public, internal]
    restart: unless-stopped

volumes:
  # GET /api/usage reads this; it survives `docker compose down` (not `down -v`).
  usage-data: {}
  # The ClamAV signature database, so a restart does not download it again.
  clamav-db: {}

networks:
  public: {}
  internal:
    # No outbound access from this network: the document service can only answer the gateway.
    internal: true
